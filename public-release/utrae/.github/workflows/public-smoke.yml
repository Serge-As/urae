name: UTRAE public synthetic smoke
on:
  push:
    branches: [main]
    paths: [site/**, tests/**, package.json, .github/workflows/public-smoke.yml]
  pull_request:
    branches: [main]
    paths: [site/**, tests/**, package.json, .github/workflows/public-smoke.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
