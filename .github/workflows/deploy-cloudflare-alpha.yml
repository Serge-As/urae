name: Eco-System Alpha Cloudflare — Recovery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eco-system-alpha-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ECO_SYSTEM_DB: eco-system-db
      ECO_SYSTEM_HEALTH_URL: https://eco-system.sergemimf.workers.dev/health
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and extract recovered runtime source
        shell: bash
        run: |
          set -euo pipefail
          echo '4db6738d1ad3bdc6615d0cc6de6627ea1bb4489be9937241375e594cfd43d691  .recovery/ECO_SYSTEM_Runtime_Recovery_0.5.1_2.3.4.tar.gz' | sha256sum --check
          mkdir recovered
          tar -xzf .recovery/ECO_SYSTEM_Runtime_Recovery_0.5.1_2.3.4.tar.gz -C recovered
      - name: Install development dependency
        working-directory: recovered
        run: npm install --ignore-scripts
      - name: Qualification before deployment
        working-directory: recovered
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run lint:architecture
          npm run lint:shared-governance
          npm test
      - name: Verify deployment credentials exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID secret'; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo '::error::Missing CLOUDFLARE_API_TOKEN secret'; exit 1; }
      - name: Resolve or create D1 database
        working-directory: recovered
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 list --json > /tmp/d1-list.json
          DB_ID="$(node scripts/cloudflare-d1-id.mjs /tmp/d1-list.json "${ECO_SYSTEM_DB}" || true)"
          if [ -z "${DB_ID}" ]; then
            npx --yes wrangler@4 d1 create "${ECO_SYSTEM_DB}" --location=weur --update-config=false > /tmp/d1-create.txt
            npx --yes wrangler@4 d1 list --json > /tmp/d1-list-after-create.json
            DB_ID="$(node scripts/cloudflare-d1-id.mjs /tmp/d1-list-after-create.json "${ECO_SYSTEM_DB}")"
          fi
          test -n "${DB_ID}"
          node scripts/render-wrangler-d1.mjs "${DB_ID}" workers/api/wrangler.ci.toml
      - name: Apply additive D1 migrations
        working-directory: recovered
        run: npx --yes wrangler@4 d1 migrations apply "${ECO_SYSTEM_DB}" --remote --config workers/api/wrangler.ci.toml
      - name: Deploy alpha Worker
        working-directory: recovered
        run: npx --yes wrangler@4 deploy --config workers/api/wrangler.ci.toml
      - name: Smoke test health
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 "${ECO_SYSTEM_HEALTH_URL}")"
          printf '%s' "$body" > /tmp/health.json
          node -e 'const h=JSON.parse(require("fs").readFileSync("/tmp/health.json","utf8")); if(h.ok!==true||h.realMoneyEnabled!==false||h.version!=="0.5.1-recovered-unified-alpha") process.exit(1); console.log(`Health PASS: ${h.version}; realMoneyEnabled=${h.realMoneyEnabled}`)'
