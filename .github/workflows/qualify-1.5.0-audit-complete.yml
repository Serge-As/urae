name: Eco-System 1.5.0 — Audit Complete Qualification
on:
  push:
    branches: ['next/1.5.0-audit-complete-platform-20260923']
  pull_request:
    branches: ['fix/1.4.5.1-field-corrections-20260922']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run ci
