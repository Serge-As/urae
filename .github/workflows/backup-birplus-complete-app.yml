name: Eco-System 1.2 — BIR+ Verified Source + D1 + R2 Backup

on:
  workflow_dispatch:
  push:
    branches: ['next/1.2.0-functional-completion-20260913']
    paths: ['.github/BACKUP_ECO_SYSTEM_1_2_ONCE']

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ECO_SYSTEM_DB: eco-system-db
      R2_BUCKET: eco-system-backups
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build verified source archive and manifest
        shell: bash
        env:
          PRODUCT_VERSION: 1.2.0-functional-completion
          MOBILE_URL: https://eco-system.sergemimf.workers.dev/
        run: |
          set -euo pipefail
          mkdir -p /tmp/eco-backup
          HEAD_SHA="$(git rev-parse HEAD)"
          printf '%s\n' \
            "project=Eco-System" \
            "version=${PRODUCT_VERSION}" \
            "branch=next/1.2.0-functional-completion-20260913" \
            "head=${HEAD_SHA}" \
            "mobile_url=${MOBILE_URL}" \
            "realMoneyEnabled=false" \
            > /tmp/eco-backup/MANIFEST.txt
          git archive --format=tar HEAD | xz -T0 -9e > /tmp/eco-backup/eco-system-1.2-source.tar.xz
          (
            cd /tmp/eco-backup
            sha256sum eco-system-1.2-source.tar.xz > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )
          test -s /tmp/eco-backup/eco-system-1.2-source.tar.xz
      - name: Export D1 and verify restore
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 export "${ECO_SYSTEM_DB}" --remote --output=/tmp/eco-backup/eco-system-d1.sql
          sqlite3 /tmp/eco-backup/restore-check.sqlite < /tmp/eco-backup/eco-system-d1.sql
          test "$(sqlite3 /tmp/eco-backup/restore-check.sqlite 'PRAGMA integrity_check;')" = "ok"
          cd /tmp/eco-backup
          sha256sum eco-system-1.2-source.tar.xz eco-system-d1.sql > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Ensure private R2 and upload backup
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 r2 bucket list > /tmp/r2-list.txt
          if ! grep -Fq "${R2_BUCKET}" /tmp/r2-list.txt; then
            npx --yes wrangler@4 r2 bucket create "${R2_BUCKET}"
          fi
          KEY="backups/1.2/${GITHUB_SHA}"
          for file in eco-system-1.2-source.tar.xz eco-system-d1.sql SHA256SUMS.txt MANIFEST.txt; do
            npx --yes wrangler@4 r2 object put "${R2_BUCKET}/${KEY}/${file}" --remote --file="/tmp/eco-backup/${file}" --force
          done
      - uses: actions/upload-artifact@v4
        with:
          name: eco-system-1.2-birplus
          path: /tmp/eco-backup/
          retention-days: 90
          if-no-files-found: error
