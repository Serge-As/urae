name: Apply Eco-System 1.4.0 Master Closure Tranche 2
on:
  push:
    branches: ['next/1.4.0-master-2.3.4-closure-20260917']
    paths: ['.github/APPLY_MASTER_2_3_4_CLOSURE_TRANCHE2_ONCE']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: next/1.4.0-master-2.3.4-closure-20260917
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply tranche 2 with memory evidence
        run: |
          node scripts/apply-master-closure-tranche2.mjs
          printf '\n## Tranche 2 — gouvernance, notifications, invitations, calendrier, carnet membre\nApplied from checkpoint %s at %s. Dedicated contracts and UI are now under qualification; external provider delivery remains explicitly gated.\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> docs/memory/recalls/RECALL-2026-09-17-master-2.3.4-closure.md
          printf '\n## Tranche 2 impact checkpoint\nSource checkpoint: %s. New domains: governed voting, honest notification preferences/inbox, secure invitations/calendar exposure and self/manager member notebook. No second ledger, no real-money activation, no provider delivery claim.\n' "$GITHUB_SHA" >> docs/change-impact/CIR-2026-09-17-master-2.3.4-closure.md
      - name: Full qualification before commit
        run: npm run ci
      - name: Commit qualified tranche 2
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'Delor85 Eco-System CI'
          git config user.email 'actions@users.noreply.github.com'
          git add packages/module-registry/src/index.ts workers/api/src/index.ts apps/web/src/voice-entry-bootstrap.ts docs/memory/recalls/RECALL-2026-09-17-master-2.3.4-closure.md docs/change-impact/CIR-2026-09-17-master-2.3.4-closure.md
          git commit -m 'feat(1.4): qualify governance notifications and member notebook'
          git push origin HEAD:next/1.4.0-master-2.3.4-closure-20260917
