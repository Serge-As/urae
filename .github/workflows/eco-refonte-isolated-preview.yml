name: Eco-System refonte — isolated Cloudflare preview
on:
  push:
    branches: ['preview/eco-refonte-20261012']
    paths:
      - '.github/workflows/eco-refonte-isolated-preview.yml'
      - 'apps/web/index.html'
      - 'apps/web/styles.css'
      - 'apps/web/src/**'
      - 'packages/**'
      - 'workers/api/src/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eco-refonte-preview-deployment
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PREVIEW_WORKER: eco-system-refonte-preview
      PREVIEW_DB: eco-system-refonte-preview-db
      PREVIEW_BUCKET: eco-system-refonte-preview-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Require isolation and correct preproduction source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'preview/eco-refonte-20261012'
          test -f workers/api/wrangler.toml
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing Cloudflare account secret'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing Cloudflare API token secret'; exit 1; }
      - name: Locked dependencies and full app qualification
        run: |
          npm ci --ignore-scripts
          npm run ci
          npm run build
      - name: Stamp only the isolated preview PWA with its exact GitHub SHA
        shell: bash
        run: |
          set -euo pipefail
          # Old healthy preview SHA is only a rollback cache pointer, NEVER a
          # production deploy input. Network failure leaves the legacy cache.
          curl --fail --silent --show-error --max-time 9 \
            https://eco-system-refonte-preview.sergemimf.workers.dev/health \
            > /tmp/eco-preview-previous-health.json || true
          if [ -s /tmp/eco-preview-previous-health.json ]; then
            ECO_PREVIEW_PREVIOUS_SHA="$(node -e "const fs=require('fs');try{const j=JSON.parse(fs.readFileSync('/tmp/eco-preview-previous-health.json','utf8'));const s=String(j.commitSha||'');if(/^[a-f0-9]{40}$/.test(s))process.stdout.write(s)}catch{}")"
            export ECO_PREVIEW_PREVIOUS_SHA
          fi
          node scripts/preview-cache-identity.mjs
      - name: Provision only isolated preview D1 and R2 (never touch production resources)
        shell: bash
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          test "$PREVIEW_DB" = 'eco-system-refonte-preview-db'
          test "$PREVIEW_BUCKET" = 'eco-system-refonte-preview-media'
          test "$PREVIEW_WORKER" = 'eco-system-refonte-preview'
          npx --yes wrangler@4 d1 list --json > /tmp/eco-preview-d1-list.json
          DB_ID="$(node scripts/cloudflare-d1-id.mjs /tmp/eco-preview-d1-list.json "$PREVIEW_DB" || true)"
          if [ -z "$DB_ID" ]; then
            echo "Isolated preview database absent; creating the empty preview database only."
            npx --yes wrangler@4 d1 create "$PREVIEW_DB" --location=weur --update-config=false
            npx --yes wrangler@4 d1 list --json > /tmp/eco-preview-d1-list.json
            DB_ID="$(node scripts/cloudflare-d1-id.mjs /tmp/eco-preview-d1-list.json "$PREVIEW_DB" || true)"
          fi
          test -n "$DB_ID" || { echo "::error::Cannot provision isolated preview D1"; exit 1; }
          npx --yes wrangler@4 r2 bucket list > /tmp/eco-preview-r2-list.txt
          if ! grep -Fq "$PREVIEW_BUCKET" /tmp/eco-preview-r2-list.txt; then
            echo "Isolated preview media bucket absent; creating an empty bucket only."
            npx --yes wrangler@4 r2 bucket create "$PREVIEW_BUCKET"
            npx --yes wrangler@4 r2 bucket list > /tmp/eco-preview-r2-list.txt
          fi
          grep -Fq "$PREVIEW_BUCKET" /tmp/eco-preview-r2-list.txt || { echo "::error::Cannot provision isolated preview R2"; exit 1; }
          echo "PREVIEW_DB_ID=$DB_ID" >> "$GITHUB_ENV"
      - name: Generate isolated Wrangler config
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          env=os.environ
          config=Path('workers/api/wrangler.toml').read_text()
          assert 'name = "eco-system"' in config
          assert 'RELEASE_COMMIT_SHA = "UNBOUND_DEPLOY"' in config
          config=config.replace('name = "eco-system"','name = "'+env['PREVIEW_WORKER']+'"',1)
          config=config.replace('RELEASE_COMMIT_SHA = "UNBOUND_DEPLOY"','RELEASE_COMMIT_SHA = "'+env['GITHUB_SHA']+'"',1)
          config+='\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "'+env['PREVIEW_DB']+'"\ndatabase_id = "'+env['PREVIEW_DB_ID']+'"\nmigrations_dir = "../../cloudflare/migrations"\n'
          config+='\n[[r2_buckets]]\nbinding = "ARTIFACTS"\nbucket_name = "'+env['PREVIEW_BUCKET']+'"\n'
          Path('workers/api/wrangler.preview.toml').write_text(config)
          print('Worker preview configured with isolated D1/R2; production untouched.')
          PY
      - name: Preview-only schema migrations
        run: npx --yes wrangler@4 d1 migrations apply "$PREVIEW_DB" --remote --config workers/api/wrangler.preview.toml
      - name: Deploy isolated preview only
        shell: bash
        run: |
          set -euo pipefail
          # Transient Cloudflare malformed-response errors can occur after asset
          # upload; retry only the SAME isolated Worker config and SAME SHA.
          DEPLOYED=0
          for TRY in 1 2 3; do
            if npx --yes wrangler@4 deploy --config workers/api/wrangler.preview.toml; then
              DEPLOYED=1
              break
            fi
            echo "Isolated Wrangler deploy attempt $TRY failed; no production resource accessed."
            if [ "$TRY" -lt 3 ]; then sleep $((TRY*12)); fi
          done
          test "$DEPLOYED" -eq 1 || { echo "::error::ISOLATED_PREVIEW_DEPLOY_UNAVAILABLE"; exit 1; }
      - name: Prove preview PWA and release health
        shell: bash
        run: |
          set -euo pipefail
          URL="https://eco-system-refonte-preview.sergemimf.workers.dev"
          # Cloudflare workers.dev may still serve an older revision for a
          # short propagation window after Wrangler reports upload success.
          # Verify the EXACT SHA, never accept an old revision as green.
          PROVED=0
          for ATTEMPT in $(seq 1 20); do
            curl --fail --show-error --silent --retry 3 --retry-delay 1 "$URL/health" > /tmp/eco-preview-health.json
            curl --fail --show-error --silent --retry 3 --retry-delay 1 "$URL/" > /tmp/eco-preview-root.html
            if node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const health=JSON.parse(fs.readFileSync('/tmp/eco-preview-health.json','utf8'));
          const root=fs.readFileSync('/tmp/eco-preview-root.html','utf8');
          if(health.ok!==true)throw Error('HEALTH_NOT_OK');
          if(health.realMoneyEnabled!==false)throw Error('REAL_MONEY_UNSAFE');
          if(health.commitSha!==process.env.GITHUB_SHA)throw Error('COMMIT_MISMATCH');
          if(!root.toLowerCase().includes('<!doctype html>'))throw Error('ROOT_NOT_PWA');
          console.log('PREVIEW_PUBLISHED_AND_VERIFIED',health.version,health.commitSha);
          NODE
            then
              PROVED=1
              break
            fi
            echo "Waiting for deployed preview SHA to propagate (attempt $ATTEMPT)."
            sleep 6
          done
          test "$PROVED" -eq 1 || { echo "::error::PREVIEW_SHA_NOT_PROPAGATED"; exit 1; }
# real-screen UX pass 20261012: isolated preview only; never touches production.
