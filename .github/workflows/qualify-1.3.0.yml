name: Qualify Eco-System 1.3.0 Guided AI + Live Innovations
on:
  push:
    branches: ['next/1.3.0-guided-ai-live-20260915']
  pull_request:
    branches: ['next/1.2.0-functional-completion-20260913']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run ci
