name: Eco-System 1.3.2 — Production Deploy

on:
  workflow_dispatch:
  push:
    branches: ['next/1.3.2-savings-control-forum-live-20260916']
    paths: ['.github/DEPLOY_ECO_SYSTEM_1_3_2_ONCE']

permissions:
  contents: read

concurrency:
  group: eco-system-production-1-3-2
  cancel-in-progress: false

env:
  PROD_WORKER: eco-system
  PROD_DB: eco-system-db
  PROD_R2: eco-system-backups
  PROD_ROOT: https://eco-system.sergemimf.workers.dev
  EXPECTED_VERSION: 1.3.2-savings-control-forum-live

jobs:
  qualify-backup-deploy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      COLLECTIVE_LEARNING_PEPPER: ${{ secrets.COLLECTIVE_LEARNING_PEPPER }}
      IDENTITY_MATCH_PEPPER: ${{ secrets.IDENTITY_MATCH_PEPPER }}
      FOUNDER_TEAM_ACTORS: ${{ secrets.FOUNDER_TEAM_ACTORS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Verify production prerequisites before any mutation
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${FOUNDER_TEAM_ACTORS:-}" || { echo "::error::FOUNDER_TEAM_ACTORS is required so the Control Center is not silently hidden."; exit 2; }
          if [ -z "${IDENTITY_MATCH_PEPPER:-}" ] && [ -z "${COLLECTIVE_LEARNING_PEPPER:-}" ]; then
            echo "::error::IDENTITY_MATCH_PEPPER or COLLECTIVE_LEARNING_PEPPER is required for protected identity matching."
            exit 2
          fi
          npx --yes wrangler@4 d1 list --json >/tmp/d1-auth.json
          npx --yes wrangler@4 r2 bucket list >/tmp/r2-auth.txt
          echo "Cloudflare D1 + R2 authentication PASS"

      - name: Full qualification
        run: npm run ci

      - name: Build Worker and PWA
        run: npm run build

      - name: Resolve existing production D1 and private R2
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 list --json > /tmp/d1-list.json
          DB_ID="$(node scripts/cloudflare-d1-id.mjs /tmp/d1-list.json "${PROD_DB}" || true)"
          if [ -z "${DB_ID}" ]; then
            echo "::error::Existing production DB ${PROD_DB} not found. Refusing to create or replace it."
            exit 3
          fi
          npx --yes wrangler@4 r2 bucket list > /tmp/r2-list.txt
          if ! grep -Fq "${PROD_R2}" /tmp/r2-list.txt; then
            echo "Creating private R2 bucket ${PROD_R2}."
            npx --yes wrangler@4 r2 bucket create "${PROD_R2}"
          else
            echo "Reusing existing private R2 bucket ${PROD_R2}."
          fi
          node scripts/render-wrangler-storage.mjs "${DB_ID}" "${PROD_R2}" workers/api/wrangler.prod132.toml
          sed -i 's/PREMIUM_LIVE_LEDGER = "false"/PREMIUM_LIVE_LEDGER = "true"/' workers/api/wrangler.prod132.toml
          grep -q 'name = "eco-system"' workers/api/wrangler.prod132.toml
          grep -q 'database_name = "eco-system-db"' workers/api/wrangler.prod132.toml
          grep -q 'bucket_name = "eco-system-backups"' workers/api/wrangler.prod132.toml
          grep -q 'PREMIUM_LIVE_LEDGER = "true"' workers/api/wrangler.prod132.toml
          grep -q 'class_name = "GroupLiveHub"' workers/api/wrangler.prod132.toml
          grep -q 'storage = "sqlite"' workers/api/wrangler.prod132.toml

      - name: Pre-deploy BIR+ production snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/predeploy
          git archive --format=tar HEAD | xz -T0 -9e > /tmp/predeploy/eco-system-1.3.2-source.tar.xz
          npx --yes wrangler@4 d1 export "${PROD_DB}" --remote --output=/tmp/predeploy/eco-system-production-before-1.3.2.sql
          sqlite3 /tmp/predeploy/restore-check.sqlite < /tmp/predeploy/eco-system-production-before-1.3.2.sql
          test "$(sqlite3 /tmp/predeploy/restore-check.sqlite 'PRAGMA integrity_check;')" = "ok"
          cd /tmp/predeploy
          sha256sum eco-system-1.3.2-source.tar.xz eco-system-production-before-1.3.2.sql > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: eco-system-1.3.2-predeploy-birplus
          path: /tmp/predeploy/
          retention-days: 90
          if-no-files-found: error

      - name: Mirror BIR+ snapshot to R2
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="birplus/1.3.2/${GITHUB_SHA}/predeploy"
          npx --yes wrangler@4 r2 object put "${PROD_R2}/${PREFIX}/eco-system-1.3.2-source.tar.xz" --file /tmp/predeploy/eco-system-1.3.2-source.tar.xz --remote
          npx --yes wrangler@4 r2 object put "${PROD_R2}/${PREFIX}/eco-system-production-before-1.3.2.sql" --file /tmp/predeploy/eco-system-production-before-1.3.2.sql --remote
          npx --yes wrangler@4 r2 object put "${PROD_R2}/${PREFIX}/SHA256SUMS.txt" --file /tmp/predeploy/SHA256SUMS.txt --remote
          npx --yes wrangler@4 r2 object get "${PROD_R2}/${PREFIX}/SHA256SUMS.txt" --file /tmp/r2-SHA256SUMS.txt --remote
          cmp /tmp/predeploy/SHA256SUMS.txt /tmp/r2-SHA256SUMS.txt
          echo "R2 BIR+ mirror PASS"

      - name: Configure production secrets
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${FOUNDER_TEAM_ACTORS}" | npx --yes wrangler@4 secret put FOUNDER_TEAM_ACTORS --config workers/api/wrangler.prod132.toml
          if [ -n "${COLLECTIVE_LEARNING_PEPPER:-}" ]; then
            printf '%s' "${COLLECTIVE_LEARNING_PEPPER}" | npx --yes wrangler@4 secret put COLLECTIVE_LEARNING_PEPPER --config workers/api/wrangler.prod132.toml
          fi
          if [ -n "${IDENTITY_MATCH_PEPPER:-}" ]; then
            printf '%s' "${IDENTITY_MATCH_PEPPER}" | npx --yes wrangler@4 secret put IDENTITY_MATCH_PEPPER --config workers/api/wrangler.prod132.toml
          fi

      - name: Apply additive D1 migrations
        run: npx --yes wrangler@4 d1 migrations apply "${PROD_DB}" --remote --config workers/api/wrangler.prod132.toml

      - name: Deploy Eco-System 1.3.2 production
        run: npx --yes wrangler@4 deploy --config workers/api/wrangler.prod132.toml

      - name: Smoke production truth
        shell: bash
        run: |
          set -euo pipefail
          root='';health=''
          for attempt in 1 2 3 4 5 6 7 8; do
            root="$(curl --fail-with-body --silent --show-error --location --max-time 20 "${PROD_ROOT}/" || true)"
            health="$(curl --fail-with-body --silent --show-error --location --max-time 20 "${PROD_ROOT}/health" || true)"
            if grep -q '1.3.2 CONTROL' <<<"${root}" && grep -q "${EXPECTED_VERSION}" <<<"${health}"; then break; fi
            sleep 4
          done
          grep -q '1.3.2 CONTROL' <<<"${root}"
          grep -q 'Cahier Maître 3.0.0' <<<"${root}"
          printf '%s' "${health}" | grep -q '"ok": true'
          printf '%s' "${health}" | grep -q "${EXPECTED_VERSION}"
          printf '%s' "${health}" | grep -q '"realMoneyEnabled": false'
          printf '%s' "${health}" | grep -q '"premiumLiveEnabled": true'
          printf '%s' "${health}" | grep -q '"founderControlBound": true'
          printf '%s' "${health}" | grep -q '"communityRealtimeBound": true'
          printf '%s' "${health}" | grep -q '"artifactStorageMode": "R2"'
          echo "Production 1.3.2 smoke PASS"

      - name: Production URL
        run: echo "${PROD_ROOT}/"
