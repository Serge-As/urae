name: Contrôle des deux démarrages Canopée
on:
  push:
    branches: ['codex/verification-reprise-webkit-20261123']
    paths: ['tests/browser/canopee-reperes-20261026.spec.mjs']
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    timeout-minutes: 12
    env:
      PYTHON: /usr/bin/python3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          npm ci --ignore-scripts
          npm install --ignore-scripts --no-save --package-lock=false @playwright/test@1.58.2
          npm run build
          node scripts/qualify-browser-isolated.mjs --browser=webkit '--grep=financial startup presentation' tests/browser/canopee-reperes-20261026.spec.mjs
          node scripts/qualify-browser-isolated.mjs --browser=chromium '--grep=financial startup presentation' tests/browser/canopee-reperes-20261026.spec.mjs
