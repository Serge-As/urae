name: Eco — feuille financière et reprise de séance
on:
  push:
    branches: ['codex/verification-reprise-webkit-20261123']
    paths: ['tests/browser/refresh-offline-recovery-20261103.spec.mjs']
permissions:
  contents: read
jobs:
  qualifier:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        transport: [actuel, direct]
    name: ${{ matrix.transport }}
    timeout-minutes: 12
    env:
      PYTHON: /usr/bin/python3
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          npm ci --ignore-scripts
          npm install --ignore-scripts --no-save --package-lock=false @playwright/test@1.58.2
          if [[ '${{ matrix.transport }}' = direct ]]; then sed -i '/^    event.respondWith(fetch(event.request));$/d' apps/web/sw.js; fi
          npm run build
      - name: Mesurer les appels après reconnexion
        run: node scripts/qualify-browser-isolated.mjs --browser=webkit tests/browser/refresh-offline-recovery-20261103.spec.mjs
