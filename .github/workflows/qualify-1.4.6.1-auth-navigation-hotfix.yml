name: Eco-System 1.4.6.1 — Auth Navigation Hotfix Qualification
on:
  push:
    branches: ['hotfix/1.4.6-auth-navigation-regression-20260921']
  pull_request:
    branches: ['next/1.4.6-ui-sessions-community-blueprint-final-20260921']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run ci
