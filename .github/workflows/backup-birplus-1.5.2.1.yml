name: Eco-System 1.5.2.1 — BIR+ Closure Source + D1 Backup

on:
  workflow_dispatch:
  push:
    branches: ['release/1.5.2-unified-ux-blueprint-20260923']
    paths: ['.github/BACKUP_ECO_SYSTEM_1_5_2_1_ONCE']

permissions:
  contents: read

concurrency:
  group: eco-system-1-5-2-1-closure-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ECO_SYSTEM_DB: eco-system-db
      EXPECTED_PRODUCTION_VERSION: 1.5.2.1-field-finance-debt-ux
      EXPECTED_PRODUCTION_SHA: 109078c84374dddf5f64d8d836a2a726fd4a92ea
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Qualify exact closure source
        run: npm run ci
      - name: Verify production identity remains the deployed hotfix
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 https://eco-system.sergemimf.workers.dev/health > /tmp/health.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          if(h.ok!==true)throw new Error('HEALTH_NOT_OK');
          if(h.version!==process.env.EXPECTED_PRODUCTION_VERSION)throw new Error('VERSION_MISMATCH:'+h.version);
          if(h.commitSha!==process.env.EXPECTED_PRODUCTION_SHA)throw new Error('PRODUCTION_SHA_MISMATCH:'+h.commitSha);
          if(h.realMoneyEnabled!==false)throw new Error('REAL_MONEY_MUST_REMAIN_DISABLED');
          if(h.artifactStorageMode!=='R2')throw new Error('R2_NOT_ACTIVE:'+h.artifactStorageMode);
          console.log(JSON.stringify({version:h.version,commitSha:h.commitSha,realMoneyEnabled:h.realMoneyEnabled,artifactStorageMode:h.artifactStorageMode}));
          NODE
      - name: Archive exact closure source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/eco-backup
          HEAD_SHA="$(git rev-parse HEAD)"
          printf '%s\n' \
            "project=Eco-System" \
            "closure_line=1.5.2.1-field-finance-debt-ux" \
            "branch=release/1.5.2-unified-ux-blueprint-20260923" \
            "closure_head=${HEAD_SHA}" \
            "production_source=${EXPECTED_PRODUCTION_SHA}" \
            "production_url=https://eco-system.sergemimf.workers.dev/" \
            "realMoneyEnabled=false" \
            > /tmp/eco-backup/MANIFEST.txt
          git archive --format=tar HEAD | xz -T0 -9e > /tmp/eco-backup/eco-system-1.5.2.1-source.tar.xz
      - name: Export production D1 and prove restoration
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 export "${ECO_SYSTEM_DB}" --remote --output=/tmp/eco-backup/eco-system-production-d1.sql
          sqlite3 /tmp/eco-backup/restore-check.sqlite < /tmp/eco-backup/eco-system-production-d1.sql
          test "$(sqlite3 /tmp/eco-backup/restore-check.sqlite 'PRAGMA integrity_check;')" = "ok"
          cd /tmp/eco-backup
          sha256sum eco-system-1.5.2.1-source.tar.xz eco-system-production-d1.sql MANIFEST.txt > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Verify recovery anchors
        shell: bash
        run: |
          set -euo pipefail
          test -s AGENTS.md
          test -s docs/memory/CURRENT_TRUTH.md
          test -s docs/memory/PROJECT_TRUTH_LEDGER.json
          test -s PROJECT_STATE.md
          test -s NEXT_RUN.md
          test -s FEATURE_REGISTRY.yaml
          test -s docs/recovery/ECO_SYSTEM_1.5.2.1_FIELD_FEEDBACK_CURRENT_TRUTH_2026-09-23.md
          test -s docs/constitution/ECO_SYSTEM_Cahier_des_Charges_Maitre_Exhaustif_3.2.0_2026-09-16.md
      - uses: actions/upload-artifact@v4
        with:
          name: eco-system-1.5.2.1-birplus-closure-${{ github.sha }}
          path: /tmp/eco-backup/
          retention-days: 90
          if-no-files-found: error
      - name: Mirror final BIR+ checkpoint to R2
        shell: bash
        run: |
          set -euo pipefail
          if ! npx --yes wrangler@4 r2 bucket list | grep -Fq 'eco-system-backups'; then
            echo "::error::Required acquired R2 bucket eco-system-backups is unavailable; refusing to call closure complete."
            exit 1
          fi
          PREFIX="birplus/1.5.2.1/${GITHUB_SHA}/final"
          npx --yes wrangler@4 r2 object put "eco-system-backups/${PREFIX}/eco-system-1.5.2.1-source.tar.xz" --file /tmp/eco-backup/eco-system-1.5.2.1-source.tar.xz --remote
          npx --yes wrangler@4 r2 object put "eco-system-backups/${PREFIX}/eco-system-production-d1.sql" --file /tmp/eco-backup/eco-system-production-d1.sql --remote
          npx --yes wrangler@4 r2 object put "eco-system-backups/${PREFIX}/MANIFEST.txt" --file /tmp/eco-backup/MANIFEST.txt --remote
          npx --yes wrangler@4 r2 object put "eco-system-backups/${PREFIX}/SHA256SUMS.txt" --file /tmp/eco-backup/SHA256SUMS.txt --remote
          npx --yes wrangler@4 r2 object get "eco-system-backups/${PREFIX}/SHA256SUMS.txt" --file /tmp/final-r2-checksums.txt --remote
          cmp /tmp/eco-backup/SHA256SUMS.txt /tmp/final-r2-checksums.txt
          echo "Final BIR+ R2 mirror PASS"
