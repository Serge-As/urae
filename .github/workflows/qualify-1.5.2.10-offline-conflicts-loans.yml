name: Eco-System 1.5.2.10 — Offline Conflicts Loans Qualification

on:
  push:
    branches:
      - 'fix/1.5.2.10-offline-conflicts-loans-20261003'
      - 'fix/field-regressions-recovery-20261005'
      - 'fix/eco-q01-q28-staged-recovery-20261006'
      - 'fix/transport-recovery-bounded-20261008'
      - 'codex/lot-24-notification-inbox-20261021'
      - 'codex/lot-25-eco-care-20261021'
      - 'codex/groups-governance-trust-20261022'
      - 'codex/business-value-network-20261022'
      - 'codex/temporal-commerce-pilots-20261022'
      - 'codex/financial-explanations-20261022'
      - 'codex/productive-community-cohort-20261022'
      - 'codex/review-recovery-cohort-20261023'
      - 'codex/canopee-eight-lots-20261029'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eco-system-1-5-2-10-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governed-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Full governed CI
        run: npm run ci
      - name: Build exact public shell
        run: npm run build
      - name: Archive exact source with SHA-256 for recovery
        shell: bash
        run: |
          mkdir -p /tmp/eco-source-recovery
          git archive --format=tar.gz HEAD > /tmp/eco-source-recovery/source-${{ github.sha }}.tar.gz
          cd /tmp/eco-source-recovery
          sha256sum source-${{ github.sha }}.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
          tar -tzf source-${{ github.sha }}.tar.gz >/dev/null
      - name: Retain source recovery archive
        uses: actions/upload-artifact@v4
        with:
          name: eco-source-recovery-${{ github.sha }}
          path: /tmp/eco-source-recovery/
          retention-days: 30

  browser-critical:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trust only the checked-out CI workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Install Chromium and WebKit
        run: |
          node -e "if(require('@playwright/test/package.json').version!=='1.56.1')throw Error('BROWSER_LIBRARY_VERSION_MISMATCH');"
          python3 --version
          node -e "(async()=>{const p=require('@playwright/test');for(const name of ['chromium','webkit']){const browser=await p[name].launch();console.log(name+': '+browser.version());await browser.close();}})().catch(error=>{console.error(error);process.exit(1);});"
      - name: WebKit sovereign offline
        run: node scripts/qualify-browser-isolated.mjs --browser=webkit tests/browser/eight-lots-20261029.spec.mjs tests/browser/eight-lots-experience-20261030.spec.mjs tests/browser/capability-placement-canopee-20261027.spec.mjs tests/browser/canopee-reperes-20261026.spec.mjs tests/browser/consolidated-completion-20261025.spec.mjs tests/browser/eco-system-webkit-sovereign-offline-1.5.2.9.spec.mjs tests/browser/engine-rehearsal-incident-20261024.spec.mjs tests/browser/productive-continuity-20261024.spec.mjs
      - name: Chromium financial persistence and shell
        run: node scripts/qualify-browser-isolated.mjs --browser=chromium tests/browser/eight-lots-20261029.spec.mjs tests/browser/eight-lots-experience-20261030.spec.mjs tests/browser/capability-placement-canopee-20261027.spec.mjs tests/browser/canopee-reperes-20261026.spec.mjs tests/browser/consolidated-completion-20261025.spec.mjs tests/browser/productive-continuity-20261024.spec.mjs tests/browser/engine-rehearsal-incident-20261024.spec.mjs tests/browser/common-innovations-20261023.spec.mjs tests/browser/review-recovery-20261023.spec.mjs tests/browser/business-value-network-20261022.spec.mjs tests/browser/personal-shops-lot10-20261020.spec.mjs tests/browser/financial-cell-consensus-persistence-1.5.2.6.spec.mjs tests/browser/browser-shell-mobile-1.5.2.6.spec.mjs tests/browser/sovereign-multi-manager-1.5.2.14.spec.mjs tests/browser/navigation-lot01-20261020.spec.mjs tests/browser/session-rehearsal-lot05-20261020.spec.mjs tests/browser/request-budget-lot28-20261020.spec.mjs tests/browser/cockpit-priorities-lot02-20261020.spec.mjs tests/browser/assistant-tools-lot23-20261020.spec.mjs tests/browser/market-orders-lot10-20261020.spec.mjs tests/browser/notification-inbox-lot24-20261021.spec.mjs tests/browser/cockpit-continuity-20261015.spec.mjs tests/browser/care-lot25-20261021.spec.mjs tests/browser/launch-kit-lot03-20261022.spec.mjs tests/browser/groups-governance-trust-20261022.spec.mjs tests/browser/temporal-commerce-pilots-20261022.spec.mjs tests/browser/financial-explanations-20261022.spec.mjs tests/browser/productive-community-20261022.spec.mjs
      - name: Supplemental acquired two-account and F5 regression
        run: node scripts/qualify-browser-isolated.mjs --browser=chromium tests/browser/window-account-finance-20261010.spec.mjs
      - name: Retain isolated browser qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-isolated-${{ github.job }}-${{ github.sha }}
          path: artifacts/browser-isolated/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eco-15210-critical-browser-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            /tmp/eco-15210-browser.log
          if-no-files-found: ignore
