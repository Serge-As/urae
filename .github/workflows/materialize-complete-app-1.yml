name: Eco-System 1.0 — Materialize Complete App

on:
  push:
    branches: ['next/1.0.0-complete-app']
    paths:
      - '.bootstrap/complete-app-1.0/TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eco-system-complete-app-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct exact qualified payload
        shell: bash
        run: |
          set -euo pipefail
          BOOT=.bootstrap/complete-app-1.0
          test -f "$BOOT/MANIFEST.txt"
          EXPECTED="$(sed -n 's/^archive_sha256=//p' "$BOOT/MANIFEST.txt")"
          test -n "$EXPECTED"
          cat "$BOOT"/part-*.b64 > /tmp/complete-app.b64
          base64 --decode /tmp/complete-app.b64 > /tmp/complete-app.tar.xz
          ACTUAL="$(sha256sum /tmp/complete-app.tar.xz | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED" || { echo "::error::Payload SHA mismatch"; exit 1; }
          mkdir -p /tmp/complete-app-payload
          tar -xJf /tmp/complete-app.tar.xz -C /tmp/complete-app-payload
          cp -a /tmp/complete-app-payload/. ./
          echo "Payload verified: $ACTUAL"
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Full Complete App qualification before commit
        run: npm run ci
      - name: Commit materialized Complete App
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md NEXT_RUN.md README.md FEATURE_REGISTRY.yaml PROJECT_STATE.md package.json apps packages workers scripts tests docs
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
            exit 0
          fi
          git commit -m 'feat: materialize Eco-System 1.0 Complete App'
          git push origin HEAD:next/1.0.0-complete-app
