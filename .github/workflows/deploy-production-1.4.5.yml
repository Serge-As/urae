name: Eco-System 1.4.5 — Production Deploy

on:
  workflow_dispatch:
  push:
    branches: ['next/1.4.5-final-mega-offline-governance-20260921']
    paths: ['.github/DEPLOY_ECO_SYSTEM_1_4_5_ONCE']

permissions:
  contents: read

concurrency:
  group: eco-system-production-1-4-5
  cancel-in-progress: false

env:
  PROD_WORKER: eco-system
  PROD_DB: eco-system-db
  PROD_R2: eco-system-backups
  PROD_ROOT: https://eco-system.sergemimf.workers.dev
  EXPECTED_VERSION: 1.4.5-final-mega-offline-governance

jobs:
  qualify-backup-deploy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      COLLECTIVE_LEARNING_PEPPER: ${{ secrets.COLLECTIVE_LEARNING_PEPPER }}
      IDENTITY_MATCH_PEPPER: ${{ secrets.IDENTITY_MATCH_PEPPER }}
      FOUNDER_TEAM_ACTORS: ${{ secrets.FOUNDER_TEAM_ACTORS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Verify production prerequisites before mutation
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          npx --yes wrangler@4 d1 list --json >/tmp/d1-auth.json
          npx --yes wrangler@4 r2 bucket list >/tmp/r2-auth.txt
          grep -Fq "${PROD_R2}" /tmp/r2-auth.txt
          echo "Cloudflare D1 + R2 prerequisites PASS"

      - name: Full qualification
        run: npm run ci

      - name: Build Worker and PWA
        run: npm run build

      - name: Resolve existing production storage
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 list --json > /tmp/d1-list.json
          DB_ID="$(node scripts/cloudflare-d1-id.mjs /tmp/d1-list.json "${PROD_DB}" || true)"
          test -n "${DB_ID}"
          npx --yes wrangler@4 r2 bucket list > /tmp/r2-list.txt
          grep -Fq "${PROD_R2}" /tmp/r2-list.txt
          node scripts/render-wrangler-storage.mjs "${DB_ID}" "${PROD_R2}" workers/api/wrangler.prod145.toml
          sed -i 's#main = "src/index.ts"#main = "src/production.ts"#' workers/api/wrangler.prod145.toml
          sed -i 's/PREMIUM_LIVE_LEDGER = "false"/PREMIUM_LIVE_LEDGER = "true"/' workers/api/wrangler.prod145.toml
          grep -q 'main = "src/production.ts"' workers/api/wrangler.prod145.toml
          grep -q 'name = "eco-system"' workers/api/wrangler.prod145.toml
          grep -q 'database_name = "eco-system-db"' workers/api/wrangler.prod145.toml
          grep -q 'bucket_name = "eco-system-backups"' workers/api/wrangler.prod145.toml
          grep -q 'PREMIUM_LIVE_LEDGER = "true"' workers/api/wrangler.prod145.toml
          grep -q 'class_name = "GroupLiveHub"' workers/api/wrangler.prod145.toml
          grep -q 'storage = "sqlite"' workers/api/wrangler.prod145.toml
          grep -q 'binding = "AI"' workers/api/wrangler.prod145.toml

      - name: Pre-deploy BIR+ snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/predeploy
          git archive --format=tar HEAD | xz -T0 -9e > /tmp/predeploy/eco-system-1.4.5-source.tar.xz
          npx --yes wrangler@4 d1 export "${PROD_DB}" --remote --output=/tmp/predeploy/eco-system-production-before-1.4.5.sql
          sqlite3 /tmp/predeploy/restore-check.sqlite < /tmp/predeploy/eco-system-production-before-1.4.5.sql
          test "$(sqlite3 /tmp/predeploy/restore-check.sqlite 'PRAGMA integrity_check;')" = "ok"
          cd /tmp/predeploy
          sha256sum eco-system-1.4.5-source.tar.xz eco-system-production-before-1.4.5.sql > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: eco-system-1.4.5-predeploy-birplus
          path: /tmp/predeploy/
          retention-days: 90
          if-no-files-found: error

      - name: Mirror pre-deploy BIR+ to R2
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="birplus/1.4.5/${GITHUB_SHA}/predeploy"
          for F in eco-system-1.4.5-source.tar.xz eco-system-production-before-1.4.5.sql SHA256SUMS.txt; do
            npx --yes wrangler@4 r2 object put "${PROD_R2}/${PREFIX}/${F}" --file "/tmp/predeploy/${F}" --remote
          done
          npx --yes wrangler@4 r2 object get "${PROD_R2}/${PREFIX}/SHA256SUMS.txt" --file /tmp/r2-pre-check.txt --remote
          cmp /tmp/predeploy/SHA256SUMS.txt /tmp/r2-pre-check.txt

      - name: Preserve or configure production secrets
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 secret list --config workers/api/wrangler.prod145.toml > /tmp/worker-secrets.txt || true
          if [ -n "${FOUNDER_TEAM_ACTORS:-}" ]; then printf '%s' "${FOUNDER_TEAM_ACTORS}" | npx --yes wrangler@4 secret put FOUNDER_TEAM_ACTORS --config workers/api/wrangler.prod145.toml; fi
          if [ -n "${COLLECTIVE_LEARNING_PEPPER:-}" ]; then
            printf '%s' "${COLLECTIVE_LEARNING_PEPPER}" | npx --yes wrangler@4 secret put COLLECTIVE_LEARNING_PEPPER --config workers/api/wrangler.prod145.toml
          elif ! grep -q 'COLLECTIVE_LEARNING_PEPPER' /tmp/worker-secrets.txt; then
            openssl rand -hex 48 | npx --yes wrangler@4 secret put COLLECTIVE_LEARNING_PEPPER --config workers/api/wrangler.prod145.toml
          fi
          if [ -n "${IDENTITY_MATCH_PEPPER:-}" ]; then
            printf '%s' "${IDENTITY_MATCH_PEPPER}" | npx --yes wrangler@4 secret put IDENTITY_MATCH_PEPPER --config workers/api/wrangler.prod145.toml
          elif ! grep -q 'IDENTITY_MATCH_PEPPER' /tmp/worker-secrets.txt; then
            openssl rand -hex 48 | npx --yes wrangler@4 secret put IDENTITY_MATCH_PEPPER --config workers/api/wrangler.prod145.toml
          fi

      - name: Apply additive D1 migrations
        run: npx --yes wrangler@4 d1 migrations apply "${PROD_DB}" --remote --config workers/api/wrangler.prod145.toml

      - name: Deploy Eco-System 1.4.5
        run: npx --yes wrangler@4 deploy --config workers/api/wrangler.prod145.toml

      - name: Smoke production 1.4.5 user-critical paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/smoke
          ready=0
          for attempt in 1 2 3 4 5 6 7 8; do
            curl --fail-with-body --silent --show-error --location --max-time 20 "${PROD_ROOT}/" > /tmp/smoke/root.html || true
            curl --fail-with-body --silent --show-error --location --max-time 20 "${PROD_ROOT}/health" > /tmp/smoke/health.json || true
            curl --fail-with-body --silent --show-error --location --max-time 20 "${PROD_ROOT}/src/main.js?v=145" > /tmp/smoke/main.js || true
            curl --fail-with-body --silent --show-error --location --max-time 20 "${PROD_ROOT}/src/sessions-ui.js" > /tmp/smoke/sessions.js || true
            curl --fail-with-body --silent --show-error --location --max-time 20 "${PROD_ROOT}/packages/application/src/index.js" > /tmp/smoke/application.js || true
            curl --fail-with-body --silent --show-error --location --max-time 20 "${PROD_ROOT}/packages/offline/src/index.js" > /tmp/smoke/offline.js || true
            curl --fail-with-body --silent --show-error --location --max-time 20 "${PROD_ROOT}/sw.js" > /tmp/smoke/sw.js || true
            if grep -Fq 'ECO-SYSTEM · 1.4.5' /tmp/smoke/root.html               && grep -Fq 'Première utilisation hors ligne' /tmp/smoke/root.html               && grep -Fq 'id="claimLocalAccountBtn"' /tmp/smoke/root.html               && grep -Fq '>Prêts<' /tmp/smoke/root.html               && grep -Fq '>Assistances<' /tmp/smoke/root.html               && grep -Fq '>Fiches membres<' /tmp/smoke/root.html               && grep -Fq '>Rubriques<' /tmp/smoke/root.html               && grep -Fq '>Corbeille<' /tmp/smoke/root.html               && grep -Fq '>Eco Relay<' /tmp/smoke/root.html               && grep -Fq 'id="meetingMatrixPanel"' /tmp/smoke/root.html               && grep -Fq 'id="individualSheetMatrix"' /tmp/smoke/root.html               && grep -Fq 'financialAlertBar' /tmp/smoke/root.html               && grep -Fq 'appBackBtn' /tmp/smoke/root.html               && grep -Fq 'Feuille récapitulative' /tmp/smoke/sessions.js               && grep -Fq 'Saisir / corriger cette séance' /tmp/smoke/sessions.js               && grep -Fq 'LOCAL_PENDING_REGISTRATION' /tmp/smoke/application.js               && grep -Fq 'claimLocalAccount' /tmp/smoke/application.js               && grep -Fq 'IndexedDbLocalAuthAdapter' /tmp/smoke/offline.js               && grep -Fq 'PBKDF2' /tmp/smoke/offline.js               && grep -Fq "eco-system-v145-final-mega-offline-safe-20260921" /tmp/smoke/sw.js; then
              ready=1; break
            fi
            sleep 4
          done
          test "${ready}" = 1
          EXPECTED_VERSION="${EXPECTED_VERSION}" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const h=JSON.parse(fs.readFileSync('/tmp/smoke/health.json','utf8'));
          const checks={
            ok:h.ok===true,
            version:h.version===process.env.EXPECTED_VERSION,
            realMoneyDisabled:h.realMoneyEnabled===false,
            premiumLive:h.premiumLiveEnabled===true,
            founderControl:h.founderControlBound===true,
            communityRealtime:h.communityRealtimeBound===true,
            r2:h.artifactStorageMode==='R2'
          };
          const failed=Object.entries(checks).filter(([,v])=>!v).map(([k])=>k);
          if(failed.length)throw new Error('PRODUCTION_145_SMOKE_FAILED:'+failed.join(',')+' '+JSON.stringify(h));
          console.log('Production 1.4.5 health PASS');
          NODE

      - name: Post-deploy BIR+ snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/postdeploy
          printf '%s\n' "version=${EXPECTED_VERSION}" "commit=${GITHUB_SHA}" "worker=${PROD_WORKER}" "database=${PROD_DB}" "deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/postdeploy/DEPLOYMENT_TRUTH.txt
          npx --yes wrangler@4 d1 export "${PROD_DB}" --remote --output=/tmp/postdeploy/eco-system-production-after-1.4.5.sql
          sqlite3 /tmp/postdeploy/restore-check.sqlite < /tmp/postdeploy/eco-system-production-after-1.4.5.sql
          test "$(sqlite3 /tmp/postdeploy/restore-check.sqlite 'PRAGMA integrity_check;')" = "ok"
          cd /tmp/postdeploy
          sha256sum eco-system-production-after-1.4.5.sql DEPLOYMENT_TRUTH.txt > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: eco-system-1.4.5-postdeploy-birplus
          path: /tmp/postdeploy/
          retention-days: 90
          if-no-files-found: error

      - name: Mirror post-deploy BIR+ to R2
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="birplus/1.4.5/${GITHUB_SHA}/postdeploy"
          for F in eco-system-production-after-1.4.5.sql DEPLOYMENT_TRUTH.txt SHA256SUMS.txt; do
            npx --yes wrangler@4 r2 object put "${PROD_R2}/${PREFIX}/${F}" --file "/tmp/postdeploy/${F}" --remote
          done
          npx --yes wrangler@4 r2 object get "${PROD_R2}/${PREFIX}/SHA256SUMS.txt" --file /tmp/r2-post-check.txt --remote
          cmp /tmp/postdeploy/SHA256SUMS.txt /tmp/r2-post-check.txt
