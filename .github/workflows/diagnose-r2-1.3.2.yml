name: Eco-System 1.3.2 — Diagnose Cloudflare R2

on:
  workflow_dispatch:
  push:
    branches: ['next/1.3.2-savings-control-forum-live-20260916']
    paths: ['.github/DIAGNOSE_R2_1_3_2_ONCE']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify same token can see D1 and classify R2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2-diagnostic
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          printf 'account_fingerprint=' > /tmp/r2-diagnostic/result.txt
          printf '%s' "${CLOUDFLARE_ACCOUNT_ID}" | sha256sum | cut -c1-12 >> /tmp/r2-diagnostic/result.txt
          if npx --yes wrangler@4 d1 list --json >/tmp/r2-diagnostic/d1.json 2>/tmp/r2-diagnostic/d1.err; then
            echo 'd1=OK' >> /tmp/r2-diagnostic/result.txt
          else
            echo 'd1=FAIL' >> /tmp/r2-diagnostic/result.txt
          fi
          set +e
          npx --yes wrangler@4 r2 bucket list >/tmp/r2-diagnostic/r2.out 2>/tmp/r2-diagnostic/r2.err
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'r2=OK' >> /tmp/r2-diagnostic/result.txt
          elif grep -q '10042' /tmp/r2-diagnostic/r2.err; then
            echo 'r2=NOT_ENTITLED_OR_WRONG_ACCOUNT_10042' >> /tmp/r2-diagnostic/result.txt
          elif grep -q '10003' /tmp/r2-diagnostic/r2.err; then
            echo 'r2=TOKEN_PERMISSION_10003' >> /tmp/r2-diagnostic/result.txt
          else
            echo 'r2=OTHER_FAILURE' >> /tmp/r2-diagnostic/result.txt
          fi
          grep -E '^(d1|r2|account_fingerprint)=' /tmp/r2-diagnostic/result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: eco-system-r2-diagnostic
          path: /tmp/r2-diagnostic/result.txt
          retention-days: 30
