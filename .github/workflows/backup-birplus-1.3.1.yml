name: Eco-System 1.3.1 — BIR+ Source + D1 Backup

on:
  workflow_dispatch:
  push:
    branches: ['next/1.3.1-recovery-recap-services-20260915']
    paths: ['.github/BACKUP_ECO_SYSTEM_1_3_1_ONCE']

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ECO_SYSTEM_DB: eco-system-db
      R2_BUCKET: eco-system-backups
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build verified source archive and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/eco-backup
          HEAD_SHA="$(git rev-parse HEAD)"
          printf '%s\n'             "project=Eco-System"             "development_line=1.3.1-recovery-recap-services"             "production_line=1.2.0-functional-completion"             "branch=next/1.3.1-recovery-recap-services-20260915"             "head=${HEAD_SHA}"             "public_url=https://eco-system.sergemimf.workers.dev/"             "live_pilot_url=https://eco-system-live-pilot.sergemimf.workers.dev/"             "realMoneyEnabled=false"             > /tmp/eco-backup/MANIFEST.txt
          git archive --format=tar HEAD | xz -T0 -9e > /tmp/eco-backup/eco-system-1.3.1-source.tar.xz
          cd /tmp/eco-backup
          sha256sum eco-system-1.3.1-source.tar.xz > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Export production D1 read-only snapshot and verify restore
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 export "${ECO_SYSTEM_DB}" --remote --output=/tmp/eco-backup/eco-system-production-d1.sql
          sqlite3 /tmp/eco-backup/restore-check.sqlite < /tmp/eco-backup/eco-system-production-d1.sql
          test "$(sqlite3 /tmp/eco-backup/restore-check.sqlite 'PRAGMA integrity_check;')" = "ok"
          cd /tmp/eco-backup
          sha256sum eco-system-1.3.1-source.tar.xz eco-system-production-d1.sql > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Verify recovery truth files are present
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/memory/CURRENT_TRUTH.md
          test -s docs/memory/PROJECT_TRUTH_LEDGER.json
          test -s PROJECT_STATE.md
          test -s NEXT_RUN.md
          test -s FEATURE_REGISTRY.yaml
          test -s docs/constitution/ECO_SYSTEM_Cahier_des_Charges_Maitre_Exhaustif_3.0.0_2026-09-16.md
          test -s docs/economics/ECO_SYSTEM_Modele_Economique_AdManager_Intelligence_3.0.0_2026-09-16.md

      - name: Upload backup to private R2 when available
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 r2 bucket list > /tmp/r2-list.txt
          if ! grep -Fq "${R2_BUCKET}" /tmp/r2-list.txt; then
            npx --yes wrangler@4 r2 bucket create "${R2_BUCKET}"
          fi
          KEY="backups/1.3.1/${GITHUB_SHA}"
          for file in eco-system-1.3.1-source.tar.xz eco-system-production-d1.sql SHA256SUMS.txt MANIFEST.txt; do
            npx --yes wrangler@4 r2 object put "${R2_BUCKET}/${KEY}/${file}" --remote --file="/tmp/eco-backup/${file}" --force
          done

      - uses: actions/upload-artifact@v4
        with:
          name: eco-system-1.3.1-birplus
          path: /tmp/eco-backup/
          retention-days: 90
          if-no-files-found: error
