name: Eco 1.5.2.12 PR qualification

on:
  pull_request:
    branches:
      - fix/1.5.2.10-offline-conflicts-loans-20261003

permissions:
  contents: read

concurrency:
  group: eco-15212-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  governed-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Full governed qualification
        run: npm run ci

  browser-critical:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build coherent application
        run: npm run build
      - name: Install qualification browsers
        run: |
          npx playwright install --with-deps chromium webkit
      - name: Start isolated acceptance server
        shell: bash
        run: |
          OPEN_BROWSER=0 PORT=4173 node scripts/dev-server.mjs > /tmp/eco-15212-pr.log 2>&1 &
          for i in {1..40}; do
            curl -fsS http://127.0.0.1:4173/health >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/eco-15212-pr.log
          exit 1
      - name: Chromium finance, sync, position and shell
        run: npx playwright test tests/browser/financial-cell-consensus-persistence-1.5.2.6.spec.mjs tests/browser/browser-shell-mobile-1.5.2.6.spec.mjs tests/browser/sovereign-multi-manager-1.5.2.14.spec.mjs --browser=chromium --workers=1
      - name: WebKit sovereign offline
        run: npx playwright test tests/browser/eco-system-webkit-sovereign-offline-1.5.2.9.spec.mjs --browser=webkit --workers=1
