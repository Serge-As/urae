name: Qualify Eco-System 1.4.2 Operational Center Sessions Blueprint
on:
  push:
    branches: ['next/1.4.2-operational-center-sessions-blueprint-20260920']
  pull_request:
    branches: ['next/1.4.1-field-integrity-guardrails-20260919']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run ci
