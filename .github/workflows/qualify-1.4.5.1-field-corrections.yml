name: Eco-System 1.4.5.1 — Field Corrections Qualification
on:
  push:
    branches: ['fix/1.4.5.1-field-corrections-20260922']
  pull_request:
    branches: ['next/1.4.5-final-mega-offline-governance-20260921']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run ci
