name: Eco-System — GEO Directory GPS Qualification

on:
  push:
    branches: ['fix/geo-directory-consented-gps-20260928']
  pull_request:
    branches: ['fix/1.5.2.6-field-persistence-pc-mobile-20260925']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eco-system-geo-directory-gps
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Full governed CI
        run: npm run ci
      - name: Focused consented GPS qualification
        run: node --test tests/geo-directory-gps-2026-09-28.test.mjs tests/semantic-business-guard-2026-09-27.test.mjs tests/capability-maturity-evidence-2026-09-26.test.mjs
