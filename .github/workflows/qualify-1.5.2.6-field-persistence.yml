name: Eco-System 1.5.2.6 — Field Persistence Browser Qualification

on:
  push:
    branches: ['fix/1.5.2.6-field-persistence-pc-mobile-20260925']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eco-system-1-5-2-6-field-qualification
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Full governed CI
        run: npm run ci
      - name: Build exact public shell
        run: npm run build
