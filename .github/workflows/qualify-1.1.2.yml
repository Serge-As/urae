name: Qualify Eco-System 1.1.2
on:
  push:
    branches: ['delivery/1.1.2-rubriques-20260913']
  pull_request:
    branches: ['next/1.1.0-cahier-app']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run ci
