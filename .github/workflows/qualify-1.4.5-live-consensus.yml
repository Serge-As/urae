name: Qualify 1.4.5 Live Multi-Manager Consensus
on:
  push:
    branches:
      - next/1.4.5-live-multi-manager-consensus-20260921
  pull_request:
    branches:
      - next/1.4.4-evidence-field-acceptance-20260921
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run ci
