name: Eco-System 1.1 — Materialize Cahier App

on:
  push:
    branches: ['next/1.1.0-cahier-app']
    paths: ['.bootstrap/cahier-app-1.1/TRIGGER']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct exact Cahier App payload
        shell: bash
        run: |
          set -euo pipefail
          BOOT=".bootstrap/cahier-app-1.1"
          cat "$BOOT"/part-*.b64 > /tmp/cahier.b64
          base64 --decode /tmp/cahier.b64 > /tmp/cahier-app-1.1-changes.tar.xz
          EXPECTED="$(sed -n 's/^expected_sha256=//p' "$BOOT/TRIGGER")"
          ACTUAL="$(sha256sum /tmp/cahier-app-1.1-changes.tar.xz | awk '{print $1}')"
          test -n "$EXPECTED"
          test "$ACTUAL" = "$EXPECTED" || { echo "::error::Payload SHA mismatch"; exit 1; }
          echo "Payload verified: $ACTUAL"
          tar -xJf /tmp/cahier-app-1.1-changes.tar.xz -C .
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Full Cahier App qualification
        run: npm run ci
      - name: Commit materialized Cahier App
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md FEATURE_REGISTRY.yaml NEXT_RUN.md PROJECT_STATE.md README.md package.json apps/web workers/api/src/index.ts scripts tests docs .recovery
          if git diff --cached --quiet; then
            echo "No product changes to commit."
          else
            git commit -m "feat: deliver Eco-System 1.1 Cahier App"
            git push origin HEAD:next/1.1.0-cahier-app
          fi
