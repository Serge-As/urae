name = "eco-system"
main = "src/index.ts"
compatibility_date = "2026-09-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# The CI workflow appends the D1 binding to a temporary wrangler.ci.toml after
# resolving the existing eco-system-db. No account id, API token or database UUID is
# committed in this file.

[assets]
directory = "../../.build/public"
binding = "ASSETS"
# Static/PWA routes are asset-first. Only server routes run the Worker first.
# This prevents HTML canonicalization loops and guarantees a real mobile door at `/`.
run_worker_first = ["/api/*", "/health"]
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"


[vars]
PREMIUM_LIVE_LEDGER = "false"
DATA_USE_PROFILE = "BETA_OPEN"

[[durable_objects.bindings]]
name = "GROUP_LIVE_HUB"
class_name = "GroupLiveHub"

[exports.GroupLiveHub]
type = "durable-object"
storage = "sqlite"
